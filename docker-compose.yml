services:
  db:
    image: postgis/postgis:16-3.4
    container_name: station-v-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-station_v}
      POSTGRES_USER: ${POSTGRES_USER:-station_v}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-station_v_dev}
    ports:
      - "5432:5432"
    volumes:
      - station_v_postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  station_v_postgres_data:
